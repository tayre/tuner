<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A calm, simple guitar tuner." />
    <title>String — Guitar Tuner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <nav class="nav" aria-label="Main navigation">
        <a class="wordmark" href="/">string<span>·</span></a>
        <span class="nav-label">Guitar tuner</span>
        <button class="help-button" type="button" aria-label="How it works">?</button>
      </nav>

      <section class="tuner" aria-labelledby="tuner-title">
        <p class="eyebrow">Standard tuning</p>
        <h1 id="tuner-title">Find your <em>sound.</em></h1>
        <p class="intro">Tune by ear with the reference notes below, or let your microphone listen when you’re ready.</p>

        <div class="dial" aria-live="polite">
          <div class="dial-inner">
            <span class="listen-state">Ready</span>
            <strong id="note">—</strong>
            <span id="frequency">Waiting for a note</span>
          </div>
          <span class="tick tick-top"></span><span class="tick tick-right"></span>
          <span class="tick tick-bottom"></span><span class="tick tick-left"></span>
        </div>
        <p class="dial-caption" id="dial-caption">Press start, then play one string.</p>

        <button class="start-button" id="start-button" type="button">
          <span class="button-dot"></span>
          Start tuning
        </button>
        <p class="permission-note" id="permission-note">Your microphone stays on this device.</p>
      </section>

      <section class="strings" aria-label="Reference notes">
        <button class="string-note" data-note="E2" data-frequency="82.41" type="button"><span>6</span><strong>E</strong><small>82.41 Hz</small></button>
        <button class="string-note" data-note="A2" data-frequency="110.00" type="button"><span>5</span><strong>A</strong><small>110.00 Hz</small></button>
        <button class="string-note" data-note="D3" data-frequency="146.83" type="button"><span>4</span><strong>D</strong><small>146.83 Hz</small></button>
        <button class="string-note" data-note="G3" data-frequency="196.00" type="button"><span>3</span><strong>G</strong><small>196.00 Hz</small></button>
        <button class="string-note" data-note="B3" data-frequency="246.94" type="button"><span>2</span><strong>B</strong><small>246.94 Hz</small></button>
        <button class="string-note" data-note="E4" data-frequency="329.63" type="button"><span>1</span><strong>E</strong><small>329.63 Hz</small></button>
      </section>
    </main>
    <footer>Made for unhurried practice.</footer>
    <script src="app.js"></script>
  </body>
</html>
